name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Si el panel publica varios cambios seguidos, solo se despliega el último.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeos (tipos, lint, contenido, mayúsculas en imports)
        run: npm run check

      - name: Build + prerender
        run: npm run build

      - name: Subir al VPS
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "$PRIVATE_KEY" > key.pem
          chmod 600 key.pem
          SSH="ssh -i key.pem -o StrictHostKeyChecking=accept-new"
          BUILD_DIR=$(date +%Y%m%d%H%M%S)

          $SSH $VPS_USER@$VPS_HOST "mkdir -p /var/www/builds/$BUILD_DIR"
          rsync -az --delete -e "$SSH" ./dist/ $VPS_USER@$VPS_HOST:/var/www/builds/$BUILD_DIR/

          # Activar la versión nueva (cambio atómico del symlink) y conservar las últimas 5
          $SSH $VPS_USER@$VPS_HOST << EOF
            set -e
            ln -sfn /var/www/builds/$BUILD_DIR /var/www/html.tmp
            [ -L /var/www/html ] || rm -rf /var/www/html
            mv -T /var/www/html.tmp /var/www/html
            sudo chown -R www-data:www-data /var/www/builds/$BUILD_DIR
            sudo chmod -R 755 /var/www/builds/$BUILD_DIR
            ls -1dt /var/www/builds/*/ | tail -n +6 | xargs -r rm -rf
            echo "Despliegue completado: $BUILD_DIR"
          EOF
          rm -f key.pem
