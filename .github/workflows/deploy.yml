name: Deploy

# El sitio lo publica Cloudflare (Workers Builds) en cada push a main: historial y rollback en su panel.
# Este workflow verifica cada push (el panel /admin muestra su estado) y dispara el rebuild semanal.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild semanal: actualiza reglas por fecha (cursos próximos, etiquetas vencidas)
  schedule:
    - cron: '0 9 * * 1'

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeos (tipos, lint, contenido, mayúsculas en imports)
        run: npm run check

      - name: Build + prerender
        run: npm run build

  weekly-rebuild:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar build en Cloudflare
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK"
