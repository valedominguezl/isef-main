# ─────────────────────────────────────────────────────────────
# I.S.E.F. San Luis — nginx (sitio estático prerenderizado)
# PLAN B: producción es Cloudflare Pages. Si se vuelve al VPS, va en
# /etc/nginx/sites-available/default. Equivale a public/_redirects + public/_headers.
# Probar: nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────

# Archivos con hash: caché de 1 año. Imágenes y documentos: 1 semana. HTML y datos: revalidar.
map $uri $isef_cache {
    ~\.(js|css|woff2?)$                       "public, max-age=31536000, immutable";
    ~\.(webp|png|jpe?g|svg|ico|pdf|docx?)$    "public, max-age=604800";
    default                                   "no-cache";
}

server {
    server_name isefsanluis.net;

    root /var/www/html;
    index index.html;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $isef_cache;

    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

    # Archivos ocultos (.htaccess, .git…), salvo los desafíos de certbot
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # URLs del sitio anterior (301 permanentes, conservan el posicionamiento)
    location ~ ^/Carrera/?$                  { return 301 /carrera; }
    location ~ ^/Inscripciones/?$            { return 301 /inscripciones; }
    location ~ ^/Especializaciones/?$        { return 301 /especializaciones; }
    location ~ ^/Aranceles/?$                { return 301 /aranceles; }
    location ~ ^/Noticias/?$                 { return 301 /novedades; }
    location ~ ^/Cookies/?$                  { return 301 /privacidad; }
    location ~ ^/Institucional/Contacto/?$   { return 301 /contacto; }
    location ~ ^/Institucional/Historia/?$   { return 301 /carrera; }
    location ~ ^/Institucional/?$            { return 301 /contacto; }
    location ~ ^/TestHiit/?$                 { return 301 /test-hiit; }
    location = /cvGatto.pdf                  { return 301 /disertantes/agustina-gatto; }

    # Quitar barra final (excepto la raíz)
    location ~ ^/(.+)/$ { return 301 /$1$is_args$args; }

    location ~* \.webmanifest$ { default_type application/manifest+json; }

    # Panel de administración (solo cliente, con subrutas)
    location ^~ /admin/ { try_files /admin.html =404; }

    location = / { try_files /index.html =404; }

    # /ruta → /ruta.html (páginas prerenderizadas)
    location / { try_files $uri $uri.html =404; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/isefsanluis.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/isefsanluis.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www → dominio sin www
server {
    server_name www.isefsanluis.net;
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/isefsanluis.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isefsanluis.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://isefsanluis.net$request_uri;
}

# HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name isefsanluis.net www.isefsanluis.net;
    return 301 https://isefsanluis.net$request_uri;
}
